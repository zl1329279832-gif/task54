databaseChangeLog:
  - changeSet:
      id: "11.1-1"
      author: ujc
      changes:
        - createTable:
            tableName: ujcms_publish_task
            columns:
              - column:
                  name: id_
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: site_id_
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: user_id_
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: target_site_id_
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: content_type_
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: content_id_
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: publish_date_
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: status_
                  type: smallint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: preview_enabled_
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: preview_expire_hours_
                  type: int
                  defaultValueNumeric: 24
              - column:
                  name: error_info_
                  type: varchar(500)
              - column:
                  name: created_
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_publish_task_site
            tableName: ujcms_publish_task
            columns:
              - column:
                  name: site_id_
        - createIndex:
            indexName: idx_publish_task_status_publish_date
            tableName: ujcms_publish_task
            columns:
              - column:
                  name: status_
              - column:
                  name: publish_date_

  - changeSet:
      id: "11.1-2"
      author: ujc
      changes:
        - createTable:
            tableName: ujcms_preview_token
            columns:
              - column:
                  name: id_
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: publish_task_id_
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: token_hash_
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: site_id_
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: content_type_
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: content_id_
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: expires_at_
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: max_usage_
                  type: int
                  defaultValueNumeric: 100
              - column:
                  name: usage_count_
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_preview_token_hash
            tableName: ujcms_preview_token
            columns:
              - column:
                  name: token_hash_
        - createIndex:
            indexName: idx_preview_token_expires
            tableName: ujcms_preview_token
            columns:
              - column:
                  name: expires_at_

  - changeSet:
      id: "11.1-3"
      author: ujc
      changes:
        - createTable:
            tableName: ujcms_preview_token_role
            columns:
              - column:
                  name: preview_token_id_
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: role_id_
                  type: bigint
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: ujcms_preview_token_role
            columnNames: preview_token_id_, role_id_
            constraintName: pk_preview_token_role
